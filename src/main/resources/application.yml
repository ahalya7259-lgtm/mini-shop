spring:
  application:
    name: mini-shop
  datasource:
    url: jdbc:h2:mem:minishop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false

server:
  port: 8080

# Default admin is created in DataInitializer (username: admin, password: admin123)
# Change passwords before any real deployment — this is an educational project only.
